<form class="comment-form" [formGroup]="form" (ngSubmit)="submit()">
  <h2>Add a comment</h2>

  <div class="field">
    <label for="userName">User Name *</label>
    <input id="userName" type="text" formControlName="userName" autocomplete="nickname" aria-describedby="userName-error" />
    @if (errorOf('userName'); as error) {
      <p id="userName-error" class="error">{{ error }}</p>
    }
  </div>

  <div class="field">
    <label for="email">E-mail *</label>
    <input id="email" type="email" formControlName="email" autocomplete="email" aria-describedby="email-error" />
    @if (errorOf('email'); as error) {
      <p id="email-error" class="error">{{ error }}</p>
    }
  </div>

  <div class="field">
    <label for="homePage">Home page</label>
    <input id="homePage" type="url" formControlName="homePage" placeholder="https://" aria-describedby="homePage-error" />
    @if (errorOf('homePage'); as error) {
      <p id="homePage-error" class="error">{{ error }}</p>
    }
  </div>

  <div class="field">
    <label for="text">Text *</label>
    <textarea id="text" formControlName="text" rows="5" aria-describedby="text-error"></textarea>
    @if (errorOf('text'); as error) {
      <p id="text-error" class="error">{{ error }}</p>
    }
  </div>

  <button type="submit">Add comment</button>
</form>
