<ul class="replies">
  @for (reply of replies(); track reply.id) {
    <li>
      <article class="reply">
        <header>
          <app-user-avatar [name]="reply.userName" />
          @if (reply.homePage) {
            <a class="name" [href]="reply.homePage" target="_blank" rel="noopener noreferrer nofollow">{{ reply.userName }}</a>
          } @else {
            <span class="name">{{ reply.userName }}</span>
          }
          <span class="email">{{ reply.email }}</span>
          <time class="date" [attr.datetime]="reply.createdAt">{{ reply.createdAt | date: 'dd.MM.yy HH:mm' }}</time>
          <button type="button" class="reply-button" (click)="dialog.openReply(reply)">Reply</button>
        </header>
        <!-- Same as in the table: the text has HTML tags and Angular cleans it before inserting -->
        <div class="text" [innerHTML]="reply.text"></div>
        @if (reply.attachment) {
          <app-attachment-view [attachment]="reply.attachment" />
        }
      </article>

      <!-- The component uses itself here, that is how any depth of replies gets drawn -->
      @if (reply.replies.length > 0) {
        <app-reply-list [replies]="reply.replies" />
      }
    </li>
  }
</ul>
