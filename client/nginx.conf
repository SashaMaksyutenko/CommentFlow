# The only door into the app: nginx serves the Angular files and passes /api, /uploads and /hubs
# to the api container. The browser sees one address, so the API needs no CORS.

# For WebSocket the Connection header must say "upgrade", for ordinary requests it stays as usual
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A comment with a file: up to a 5 MB image plus the form fields. The API allows 6 MB too.
    client_max_body_size 6m;

    # Docker's own DNS. The name "api" is looked up again every 10 seconds,
    # so nginx finds the API after it restarts with another address.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8080;

    # A tunnel on this computer (ngrok) reaches nginx through Docker's gateway, so every visitor
    # would look like the gateway's address. The tunnel adds the real address of the visitor
    # at the end of X-Forwarded-For. That header is trusted only when the request comes
    # from Docker's private networks, and only its last address is taken: the one the tunnel added,
    # not the ones a visitor may have typed in front of it.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    # The visitor's address for the API (rate limits, the IP saved with a comment).
    # It replaces whatever the visitor sent in this header, so it can't be faked.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;

    location /api/ {
        proxy_pass $api;
    }

    location /uploads/ {
        proxy_pass $api;
    }

    # SignalR: live updates over WebSocket need HTTP/1.1 and the Upgrade headers passed on
    location /hubs/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # proxy_set_header inside a location replaces the ones above, so they are repeated here
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }

    # Everything else is the Angular app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
